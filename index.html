<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Console UI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png?v=2">
<meta name="theme-color" content="#07090f">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--tile:21vh;--gap:2vh;--step:calc(var(--tile) + var(--gap));--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.64,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Figtree,"Segoe UI",system-ui,sans-serif}
button{font-family:inherit}
#rows,#list{z-index:1}
#topfade{position:fixed;left:0;right:0;top:0;height:18vh;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(7,9,15,.75),rgba(7,9,15,0))}
#sheet{position:fixed;z-index:8;left:50%;top:50%;width:min(74vw,150vh);padding:5vh 6vh;border-radius:3vh;background:rgba(14,17,26,.7);-webkit-backdrop-filter:blur(3.4vh) saturate(1.5);backdrop-filter:blur(3.4vh) saturate(1.5);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.16),0 4vh 12vh rgba(0,0,0,.6);opacity:0;visibility:hidden;transform:translate(-50%,-46%) scale(.94);transition:opacity .35s,visibility .35s,transform .6s var(--spring)}
body.sheet #sheet{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
#sheet h3{font-size:3.4vh;font-weight:800;margin-bottom:3.4vh}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:2.2vh 6vh}
.kr{display:flex;align-items:center;gap:2vh;font-size:2.1vh;font-weight:600}
.kr span{display:flex;gap:.8vh;min-width:12vh}
#sheet b{display:inline-grid;place-items:center;min-width:3.8vh;height:3.8vh;padding:0 1vh;border-radius:2vh;background:rgba(255,255,255,.14);font-size:1.8vh}
#bar #hints{opacity:.5;font-size:1.5vh}
#bar #hints b{min-width:2.6vh;height:2.6vh;font-size:1.3vh}
#hero,#top,#bar{z-index:3}
#rows{animation:fade .6s var(--ease)}
body.list #list{animation:in .55s var(--ease)}
@keyframes fade{from{opacity:0}}
#art.on #aImg{animation:pop .8s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.86)}}
#dim{position:fixed;inset:0;z-index:6;pointer-events:none;background:linear-gradient(180deg,rgba(7,9,15,.8),rgba(7,9,15,0) 60%);opacity:0;transition:opacity .5s var(--ease)}
body.menu #dim{opacity:1}
#bubbles{position:fixed;top:5vh;left:50%;transform:translateX(-50%);z-index:7;display:flex;gap:2.2vh;pointer-events:none}
.bub{display:flex;align-items:center;gap:1.4vh;padding:1.8vh 3.6vh;border-radius:99px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(2.4vh) saturate(1.4);backdrop-filter:blur(2.4vh) saturate(1.4);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.22),0 2vh 5vh rgba(0,0,0,.4);font-size:2.3vh;font-weight:700;white-space:nowrap;opacity:0;visibility:hidden;transform:translateY(-6vh) scale(.8);transition:opacity .3s,transform .4s var(--ease),visibility .3s,background .3s,color .3s}
.bub svg{width:2.8vh;fill:currentColor}
body.menu .bub{opacity:1;visibility:visible;transform:none;animation:drop .7s var(--spring) both;animation-delay:calc(var(--i) * 80ms)}
body.menu .bub.f{background:#fff;color:#07090f;transform:translateY(.8vh) scale(1.1);box-shadow:0 0 0 .4vh #1ed760,0 2.4vh 6vh rgba(0,0,0,.5)}
@keyframes drop{from{opacity:0;transform:translateY(-16vh) scale(.5)}}
.art.liked{background:linear-gradient(135deg,#4b2cff,#a8c8ff);display:grid;place-items:center}
.art.liked::after{content:"♥";font-size:9vh;color:#fff}
#list{display:none;position:fixed;left:3.4vw;right:3.4vw;top:44vh;bottom:15vh;padding:.8vh 1.6vw 0;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 10vh),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 10vh),transparent)}
body.list #list,body.list #lh{display:block}
body.list #rows{display:none}
#lh{display:none;position:fixed;left:5vw;top:39vh;z-index:3;font-size:2.4vh;font-weight:700;opacity:.8}
#lt{transition:transform .6s var(--ease);transform:translateY(calc(var(--lo,0) * -8.4vh))}
.li{display:grid;grid-template-columns:4vh 6vh 1fr auto;gap:2vh;align-items:center;height:7.8vh;margin-bottom:.6vh;padding:0 2vh;border-radius:1.6vh;opacity:.62;animation:rise .7s var(--ease) both;animation-delay:calc(var(--i) * 45ms);transition:background .3s,opacity .3s,transform .5s var(--spring),box-shadow .4s}
.li.f{background:linear-gradient(90deg,rgba(255,255,255,.24),rgba(255,255,255,.1));opacity:1;transform:scale(1.015);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.35),0 1.6vh 5vh rgba(0,0,0,.4)}
.ix{font-size:1.9vh;opacity:.6;text-align:right}
.la{width:6vh;height:6vh;border-radius:.8vh;background:#1b1f2a center/cover}
.lx{min-width:0}
.ln,.ls{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln{font-size:2.1vh;font-weight:700}
.ls{font-size:1.7vh;opacity:.6}
.ld{font-size:1.8vh;opacity:.6}
#art{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#07090f;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
#art.on{opacity:1;visibility:visible}
#aBg{position:absolute;inset:-6%;background:center/cover;filter:blur(40px) saturate(1.3) brightness(.45)}
#aImg{position:relative;width:58vh;height:58vh;border-radius:1.6vh;background:#1b1f2a center/cover;box-shadow:0 4vh 10vh rgba(0,0,0,.6)}
#aT{position:relative;margin-top:3vh;font-size:4.2vh;font-weight:800;max-width:80vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#aA{position:relative;margin-top:.8vh;font-size:2.6vh;opacity:.75}
#aProg{position:relative;margin-top:3vh;width:58vh;height:.7vh;border-radius:1vh;background:rgba(255,255,255,.2);overflow:hidden}
#aFill{height:100%;width:0;background:#fff}
body.idle,body.idle *{cursor:none}

.bg{position:fixed;inset:-6%;background-size:cover;background-position:center 30%;filter:blur(22px) saturate(1.3) brightness(.6);opacity:0;transition:opacity .9s ease}
.bg.on{opacity:1;animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.1) translate(-1.5%,1%)}}
#shade{position:fixed;inset:0;background:linear-gradient(90deg,rgba(7,9,15,.9) 0%,rgba(7,9,15,.15) 65%),linear-gradient(0deg,#07090f 8%,rgba(7,9,15,0) 55%)}

#top{position:fixed;top:4vh;left:5vw;right:5vw;display:flex;justify-content:space-between;align-items:center;font-size:2.2vh;font-weight:700}
#logo{display:flex;align-items:center;gap:1.2vh}
#logo i{width:4.4vh;height:4.4vh;border-radius:50%;background:#1ed760;display:grid;place-items:center}
#logo svg{width:2.6vh;fill:none;stroke:#07090f;stroke-width:2.4;stroke-linecap:round}
#user{display:flex;align-items:center;gap:1.4vh;opacity:.9}
#avatar{width:4.6vh;height:4.6vh;border-radius:50%;background:#2a3040 center/cover}

#hero{position:fixed;left:5vw;top:19vh;max-width:62vw}
#ht{font-size:9vh;font-weight:800;letter-spacing:-.025em;line-height:1.02;text-shadow:0 .4vh 3vh rgba(0,0,0,.6),0 0 .6vh rgba(0,0,0,.35)}
#hs{margin-top:1.6vh;font-size:2.4vh;font-weight:600;opacity:.8}
.anim{animation:in .55s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(2.4vh)}}

#rows{position:fixed;left:5vw;right:0;top:46vh;transition:transform .6s var(--ease);transform:translateY(calc(var(--r,0) * -38vh))}
.row{height:38vh;opacity:.3;filter:blur(1.1vh);transform:scale(.95);transform-origin:0 40%;transition:opacity .6s var(--ease),filter .6s var(--ease),transform .7s var(--spring)}
.row.on{opacity:1;filter:none;transform:none}
.lbl{font-size:2.6vh;font-weight:700;margin-bottom:2vh}
.track{display:flex;gap:var(--gap);transition:transform .55s var(--ease);transform:translateX(calc(var(--off,0) * var(--step) * -1))}
.tile{flex:none;width:var(--tile)}
.art{width:var(--tile);height:var(--tile);border-radius:1.2vh;background:#1b1f2a center/cover;transition:transform .5s var(--spring),box-shadow .4s}
.round .art{border-radius:50%}
.tile.f .art{transform:scale(1.09);box-shadow:0 0 0 .45vh #fff,0 3vh 7vh rgba(0,0,0,.65)}
.tile.hit .art{animation:hit .35s var(--ease)}
@keyframes hit{50%{transform:scale(1.02)}}
.nm{margin-top:1.6vh;font-size:2vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .35s var(--ease)}
.sb{margin-top:.4vh;font-size:1.7vh;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .35s var(--ease)}
.tile.f .nm,.tile.f .sb{transform:translateY(1.2vh)}
.intro .tile{animation:rise .9s var(--ease) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(6vh)}}

#bar{position:fixed;left:0;right:0;bottom:0;height:15vh;padding:3vh 5vw 0;display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:3vw;background:linear-gradient(0deg,rgba(7,9,15,.98) 55%,transparent)}
#np,#ctl{opacity:0;transform:translateY(3vh);transition:all .6s var(--ease)}
#bar.playing #np,#bar.playing #ctl{opacity:1;transform:none}
#np{display:flex;align-items:center;gap:2vh;min-width:0}
#npImg{flex:none;width:8vh;height:8vh;border-radius:1vh;background:#1b1f2a center/cover}
#npT{font-size:2.2vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#npA{font-size:1.8vh;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np div{min-width:0}
#btns{display:flex;justify-content:center;align-items:center;gap:3vh}
#btns button{background:none;border:0;color:#fff;cursor:pointer;transition:transform .2s var(--ease)}
#btns button:hover,#btns button:focus-visible{transform:scale(1.15);outline:0}
#btns svg{width:3.4vh;fill:currentColor;display:block}
#btns #pp{width:6vh;height:6vh;border-radius:50%;background:#fff;color:#07090f;display:grid;place-items:center}
#btns #pp svg{width:3vh}
#prog{margin-top:1.4vh;height:.6vh;border-radius:1vh;background:rgba(255,255,255,.2);overflow:hidden}
#fill{height:100%;width:0;background:#fff}
#times{display:flex;justify-content:space-between;margin-top:.8vh;font-size:1.5vh;opacity:.6}
#hints{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:1vh 2.4vh;font-size:1.7vh;font-weight:600;opacity:.85;white-space:nowrap}
#hints b{display:inline-grid;place-items:center;min-width:3vh;height:3vh;padding:0 .5vh;border-radius:1.5vh;background:rgba(255,255,255,.14);margin-right:.7vh;font-size:1.6vh}

#gate{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(7,9,15,.94);backdrop-filter:blur(24px);transition:opacity .6s,visibility .6s}
#gate.hide{opacity:0;visibility:hidden}
#card{width:min(560px,90vw);text-align:center;animation:in .7s var(--ease)}
#card h2{font-size:4.6vh;font-weight:800;letter-spacing:-.02em;margin-bottom:1.6vh}
#card p{font-size:2vh;opacity:.75;line-height:1.5;margin-bottom:2vh}
#card code{display:block;background:#141824;padding:1.4vh;border-radius:1vh;font-size:1.9vh;margin-bottom:2vh;user-select:all;word-break:break-all}
#card input{width:100%;padding:1.6vh 2vh;border-radius:1vh;border:2px solid #2a3040;background:#0f1320;color:#fff;font:600 2vh Figtree,sans-serif;margin-bottom:2.4vh}
#card input:focus{outline:0;border-color:#fff}
#card .btn{display:block;margin:1.4vh auto 0}
.btn{background:#fff;color:#07090f;border:0;border-radius:99px;padding:1.6vh 4vh;font-size:2.1vh;font-weight:800;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}
.btn:hover,.btn:focus-visible{transform:scale(1.07);outline:0;box-shadow:0 0 0 .4vh #1ed760}
.btn.alt{background:#1d2231;color:#fff}
.btn.danger{background:#ff5d5d;color:#fff}
#toast{position:fixed;left:50%;bottom:17vh;z-index:9;transform:translate(-50%,2vh);opacity:0;background:#1d2231;padding:1.6vh 3vh;border-radius:99px;font-size:1.9vh;font-weight:600;transition:all .4s var(--ease);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

/* ===== Controls: burbuja flotante + panel chiquito abajo a la derecha ===== */
#bar #hints{position:fixed;right:5vw;bottom:3.2vh;z-index:9;display:flex;align-items:center;justify-content:center;gap:0;padding:1.1vh 1.8vh;border-radius:5vh;opacity:1;font-size:1.5vh;font-weight:700;cursor:pointer;background:rgba(14,17,26,.62);-webkit-backdrop-filter:blur(2.4vh) saturate(1.5);backdrop-filter:blur(2.4vh) saturate(1.5);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.18),0 1.6vh 4vh rgba(0,0,0,.5);animation:ctlFloat 4.5s ease-in-out infinite;transition:background .3s,box-shadow .3s}
#bar #hints:hover,body.sheet #bar #hints{background:rgba(40,46,62,.8)}
#bar #hints b{min-width:2.6vh;height:2.6vh;font-size:1.3vh}
@keyframes ctlFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-.9vh)}}
#sheet{left:auto;top:auto;right:5vw;bottom:11vh;width:min(40vw,50vh);padding:2.6vh 2.8vh;border-radius:2.4vh;transform-origin:100% 100%;transform:translateY(1.6vh) scale(.82);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.16),0 2vh 6vh rgba(0,0,0,.55)}
body.sheet #sheet{transform:none}
#sheet h3{font-size:2.4vh;margin-bottom:2vh}
#sheet .kg{grid-template-columns:1fr;gap:1.3vh}
#sheet .kr{font-size:1.7vh;gap:1.4vh}
#sheet .kr span{min-width:9vh}
#sheet b{min-width:3vh;height:3vh;padding:0 .8vh;font-size:1.4vh;border-radius:1.5vh}
</style>
</head>
<body>

<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div><div id="shade"></div><div id="topfade"></div>

<div id="top">
  <div id="logo"><i><svg viewBox="0 0 24 24"><path d="M4 9c5-2 11-1.500 16 1.500M5 13c4-1.500 9-1 13 1.500M6 17c3.500-1 7-.5 10 1"/></svg></i>Spotify</div>
  <div id="user"><span id="who"></span><div id="avatar"></div></div>
</div>

<div id="hero"><div id="ht"></div><div id="hs"></div></div>
<div id="rows"></div>
<div id="lh"></div>
<div id="list"><div id="lt"></div></div>

<div id="bar">
  <div id="np"><div id="npImg"></div><div><div id="npT"></div><div id="npA"></div></div></div>
  <div id="ctl">
    <div id="btns">
      <button onclick="prev()" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="pp" onclick="togglePlay()" aria-label="Play/Pause"></button>
      <button onclick="next()" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div id="prog"><div id="fill"></div></div>
    <div id="times"><span id="t1">0:00</span><span id="t2">0:00</span></div>
  </div>
  <div id="hints" onclick="toggleSheet()" role="button" aria-label="Controls"></div>
</div>

<div id="art"><div id="aBg"></div><div id="aImg"></div><div id="aT"></div><div id="aA"></div><div id="aProg"><div id="aFill"></div></div></div>
<div id="sheet"></div>
<div id="dim"></div><div id="bubbles"></div>
<div id="gate"><div id="card"></div></div>
<div id="toast"></div>

<script>
// ---------- Textos (ES / EN) ----------
var T = {
  en: {
    setupT: "Initial setup", setupP: "Paste your Client ID. In the Spotify dashboard, register this Redirect URI exactly:",
    badHost: "Spotify does not accept “localhost”. Open this page with http://127.0.0.1:PORT/ or HTTPS.",
    save: "Save", badId: "That Client ID doesn't look valid",
    loginT: "Connect your account", loginP: "A Spotify window opens. Sign in and it closes by itself.", connect: "Connect Spotify", changeId: "Change Client ID",
    readyT: "All set", readyP: "Press the confirm button or Enter to start.", enter: "Start",
    setT: "Settings", setP: "Session and app configuration.", logout: "Sign out", quit: "Close app", closed: "You can close this window now", close: "Back",
    noC: "Nothing here yet", noCs: "Play something on Spotify and reopen the app.",
    playlists: "Your playlists", recent: "Recently played", artists: "Your artists",
    playlist: "Playlist", song: "Song", artist: "Artist",
    current: "Current playlist", browse: "Browse", liked: "Liked Songs", songs: "songs", loading: "Loading songs…", noList: "Spotify only lists songs of your own playlists. Playing it in full", noCur: "No playlist is playing yet", noPlay: "Nothing is playing", art: "Cover art", menu: "Menu",
    play: "Play", pause: "Pause", track: "Track", settings: "Settings", back: "Back", vol: "Volume", seek: "Seek",
    premium: "Spotify Premium is required to play music", authErr: "Session error. Open Settings and sign out",
    expired: "Your session expired. Connect Spotify again", loadErr: "Part of your library could not be loaded",
    unsupported: "This browser can't play Spotify audio (no DRM support)", connecting: "Connecting the player…",
    cantPlay: "Could not play (error ", pad: "Controller connected"
  }
};
var L = T.en;
var store = {   // todas las claves llevan prefijo para no chocar con otras apps del mismo dominio
  get: function (k) { return localStorage.getItem("ctl_" + k); },
  set: function (k, v) { localStorage.setItem("ctl_" + k, v); },
  del: function (k) { localStorage.removeItem("ctl_" + k); }
};

// ---------- Datos básicos ----------
var SCOPES = "streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state user-read-currently-playing user-read-recently-played user-top-read user-library-read playlist-read-private playlist-read-collaborative";
var REDIRECT = location.origin + location.pathname.replace(/index\.html$/, "");   // registra este Redirect URI en el dashboard de Spotify (funciona también en subcarpetas, como GitHub Pages)
var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
var ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

var rows = [], r = 0, cols = [];
var player = null, deviceId = null, vol = 0.8;
var st = null, posAt = 0;
var gateState = "";   // "setup", "login", "start", "settings" o "" (app abierta)
var bgOn = false, bgTimer = null, lastBg = "";
var mode = "browse", zone = "main", tabIdx = 1, listItems = [], li = 0, curList = null, lastList = null, artOn = false, menuOn = false, menuIdx = 0, lastDx = 0, sheetOn = false;

function $(id) { return document.getElementById(id); }
function cssUrl(u) { return 'url("' + encodeURI(u).replace(/"/g, "%22") + '")'; }
function toast(msg) {
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { t.classList.remove("show"); }, 3200);
}
function clearSession() {
  ["token", "refresh", "expires"].forEach(function (k) { store.del(k); });
}

// ---------- Login con Spotify (PKCE, sin secretos) ----------
function randomText(n) {
  var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  var a = new Uint8Array(n), s = "";
  crypto.getRandomValues(a);
  for (var i = 0; i < n; i++) { s += chars.charAt(a[i] % chars.length); }
  return s;
}
async function makeChallenge(text) {
  var hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return btoa(String.fromCharCode.apply(null, new Uint8Array(hash))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function login() {
  var verifier = randomText(64);
  store.set("verifier", verifier);
  store.set("scopes", SCOPES);
  var url = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
    response_type: "code",
    client_id: store.get("clientId"),
    scope: SCOPES,
    redirect_uri: REDIRECT,
    code_challenge_method: "S256",
    code_challenge: await makeChallenge(verifier)
  });
  var win = window.open(url, "spotifyLogin", "width=480,height=720");
  if (!win) { location.href = url; }   // ventana bloqueada: usamos la misma pestaña
}
function saveToken(t) {
  store.set("token", t.access_token);
  if (t.refresh_token) { store.set("refresh", t.refresh_token); }
  store.set("expires", Date.now() + t.expires_in * 1000 - 60000);
}
async function tokenRequest(params) {
  var res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams(params)
  });
  if (!res.ok) { throw new Error("token"); }
  saveToken(await res.json());
}
async function getToken() {
  if (Date.now() > Number(store.get("expires"))) {
    try {
      await tokenRequest({ client_id: store.get("clientId"), grant_type: "refresh_token", refresh_token: store.get("refresh") });
    } catch (e) {
      clearSession();
      showGate("login");
      toast(L.expired);
      throw e;
    }
  }

}

// ---------- Pantalla completa y cursor ----------
function goFullscreen() {   // si ya corre como app instalada, no hace falta
  if (document.fullscreenElement || matchMedia("(display-mode: fullscreen)").matches) { return; }
  try { document.documentElement.requestFullscreen().catch(function () {}); } catch (e) {}
}
var idleTimer;
function wake() {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function () { document.body.classList.add("idle"); }, 3000);
}
["mousemove", "mousedown"].forEach(function (ev) { document.addEventListener(ev, wake); });
wake();
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }

// ---------- Entrar a la app ----------
async function enterApp() {
  $("gbtn").disabled = true;
  await loadData();
  build();
  loadSDK();
  gateState = "";
  $("gate").classList.add("hide");
  goFullscreen();
  document.body.classList.add("intro");
  setTimeout(function () { document.body.classList.remove("intro"); }, 2500);
}

// ---------- Controles: teclado ----------
document.addEventListener("keydown", function (e) {
  var k = e.key;
  if (gateState) {
    var a = document.activeElement;
    if (k === "Enter" && a && a.tagName === "INPUT") { e.preventDefault(); $("gbtn").click(); }   // en botones, Enter ya hace clic solo
    else if (k === "Escape" && gateState === "settings") { closeSettings(); }
    else if (k === "ArrowDown") { e.preventDefault(); gateFocus(1); }
    else if (k === "ArrowUp") { e.preventDefault(); gateFocus(-1); }
    return;
  }
  if (sheetOn) { if (k === "Escape" || k === "Enter" || k === "Backspace" || k === "h" || k === "H" || k === "?") { toggleSheet(); } return; }
  if (k === "h" || k === "H" || k === "?") { toggleSheet(); return; }
  if (menuOn) {
    if (k === "ArrowLeft") { menuMove(-1); }
    else if (k === "ArrowRight") { menuMove(1); }
    else if (k === "Enter") { menuGo(); }
    else if (k === "Escape" || k === "Backspace" || k === "m" || k === "M") { closeMenu(); }
    return;
  }
  if (k === "v" || k === "V") { toggleArt(); return; }
  if (artOn && (k.indexOf("Arrow") === 0 || k === "Enter" || k === "Backspace" || k === "Escape")) {
    if (k === "Enter") { togglePlay(); } else if (k === "Backspace" || k === "Escape") { toggleArt(); }
    return;
  }
  if (k === "ArrowLeft") { move(-1, 0); }
  else if (k === "ArrowRight") { move(1, 0); }
  else if (k === "ArrowUp") { move(0, -1); }
  else if (k === "ArrowDown") { move(0, 1); }
  else if (k === "Enter") { select(); }
  else if (k === "Backspace") { back(); }
  else if (k === " ") { e.preventDefault(); togglePlay(); }
  else if (k === "n") { next(); }
  else if (k === "p") { prev(); }
  else if (k === "+" || k === "=") { setVol(vol + 0.05); }
  else if (k === "-") { setVol(vol - 0.05); }
  else if (k === ".") { seekBy(10000); }
  else if (k === ",") { seekBy(-10000); }
  else if (k === "f" || k === "F") { document.fullscreenElement ? document.exitFullscreen() : goFullscreen(); }
  else if (k === "Escape" || k === "m" || k === "M") { openMenu(); }
});

// ---------- Controles: gamepad (Xbox, PlayStation y genéricos con mapeo estándar) ----------
var was = {}, lastMove = 0, lastVol = 0, lastSeek = 0;
function getPad() {
  var list = navigator.getGamepads ? navigator.getGamepads() : [];
  for (var i = 0; i < list.length; i++) { if (list[i]) { return list[i]; } }
  return null;
}
function padKind(p) {
  var id = (p.id || "").toLowerCase();
  return /054c|dualsense|dualshock|playstation|wireless controller/.test(id) ? "ps" : "xbox";
}
var padLock = false, wasGuide = false;
window.addEventListener("focus", function () { padLock = false; });   // al volver a la ventana se reactivan
function readPad() {
  var p = getPad(), now = Date.now();
  var active = document.hasFocus() && !document.hidden && !padLock;
  if (p) {   // botón Guide/Home: pausa o reanuda los controles (por si el menú del theme no le quita el foco a la ventana)
    var g = !!(p.buttons[16] && p.buttons[16].pressed);
    if (g && !wasGuide) { padLock = !padLock; active = document.hasFocus() && !document.hidden && !padLock; }
    wasGuide = g;
    if (!active) {   // sin foco o en pausa: ignora todo y sincroniza el estado para no disparar acciones al volver
      for (var k = 0; k < 10; k++) { was[k] = !!(p.buttons[k] && p.buttons[k].pressed); }
      lastMove = 0; lastDx = 0;
    }
  }
  if (p && active) {
    setKind(padKind(p));
    var edge = {};
    for (var b = 0; b < 10; b++) {   // 0=A/✕ 1=B/○ 2=X/□ 3=Y/△ 4=LB/L1 5=RB/R1
      var d = !!(p.buttons[b] && p.buttons[b].pressed);
      edge[b] = d && !was[b];
      was[b] = d;
    }
    function on(i) { return !!(p.buttons[i] && p.buttons[i].pressed); }
    var dx = (on(15) || p.axes[0] > 0.5 ? 1 : 0) - (on(14) || p.axes[0] < -0.5 ? 1 : 0);
    var dy = (on(13) || p.axes[1] > 0.5 ? 1 : 0) - (on(12) || p.axes[1] < -0.5 ? 1 : 0);

    if (gateState) {
      if (edge[0]) { var a = document.activeElement; if (a && a.tagName === "BUTTON") { a.click(); } }
      if (edge[1] && gateState === "settings") { closeSettings(); }
      if (dy && now - lastMove > 200) { gateFocus(dy); lastMove = now; }
    } else {
      if (sheetOn) {
        if (edge[0] || edge[1] || edge[9]) { toggleSheet(); }
      } else if (menuOn) {
        if (edge[0]) { menuGo(); }
        if (edge[1] || edge[3]) { closeMenu(); }
        if (dx && dx !== lastDx) { menuMove(dx); }
      } else {
        if (edge[8]) { toggleArt(); }   // View / Create: cover art
        if (edge[9]) { toggleSheet(); }   // Menú / Options: controls
        if (edge[0]) { if (artOn) { togglePlay(); } else { select(); } }
        if (edge[1]) { if (artOn) { toggleArt(); } else { back(); } }
        if (edge[2]) { togglePlay(); }
        if (edge[3]) { openMenu(); }   // Y / △
        if (edge[4]) { prev(); }
        if (edge[5]) { next(); }
      }
      lastDx = dx;
      if ((dx || dy) && !artOn && !menuOn && !sheetOn) {
        if (now - lastMove > 170) { move(dx, dy); lastMove = now; }   // mantener presionado repite
      } else { lastMove = 0; }
      var sx = p.axes[2] || 0, sy = p.axes[3] || 0;   // stick derecho: volumen y adelantar
      if (Math.abs(sy) > 0.6 && now - lastVol > 130) { lastVol = now; setVol(vol - Math.sign(sy) * 0.05); }
      if (Math.abs(sx) > 0.6 && now - lastSeek > 250) { lastSeek = now; seekBy(Math.sign(sx) * 10000); }
    }
  }
  tick();
  requestAnimationFrame(readPad);
}
window.addEventListener("gamepadconnected", function () { toast(L.pad); });
readPad();

// ---------- Arranque ----------
window.addEventListener("storage", function (e) {   // la ventana de login avisa por aquí cuando termina
  if (e.key === "ctl_token" && e.newValue && gateState === "login") { showGate("start"); }
});
async function init() {
  var code = new URLSearchParams(location.search).get("code");
  if (code) {
    try {
      await tokenRequest({ client_id: store.get("clientId"), grant_type: "authorization_code", code: code, redirect_uri: REDIRECT, code_verifier: store.get("verifier") });
    } catch (e) {}
    if (window.opener) { window.close(); return; }
    history.replaceState(null, "", REDIRECT);
  }
  if (store.get("token") && store.get("scopes") !== SCOPES) { clearSession(); }   // permisos nuevos: pide iniciar sesión otra vez
  if (!store.get("clientId")) { showGate("setup"); }
  else if (!store.get("token")) { showGate("login"); }
  else { showGate("start"); }
}
buildMenu();
init();
</script>
